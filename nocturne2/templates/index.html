<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nocturne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo">NOC<span>TURNE</span></div>
    <p class="tagline">Every song. Any time.</p>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="Search any song, artist, album…" autocomplete="off" spellcheck="false" />
      <button id="searchBtn">Search</button>
    </div>
    <p class="search-hint">Try: <span class="hint-tag" data-q="Taylor Swift">Taylor Swift</span> · <span class="hint-tag" data-q="Drake">Drake</span> · <span class="hint-tag" data-q="The Weeknd">The Weeknd</span> · <span class="hint-tag" data-q="Coldplay">Coldplay</span> · <span class="hint-tag" data-q="Arijit Singh">Arijit Singh</span></p>
  </div>

  <!-- Status -->
  <div id="statusMsg" class="status-msg hidden"></div>

  <!-- Results -->
  <div id="trackList" class="track-list"></div>

</div>

<!-- Player bar -->
<div id="playerBar" class="player-bar hidden">
  <div class="player-left">
    <img id="playerThumb" src="" alt="" class="player-thumb" />
    <div class="player-meta">
      <div id="playerTitle" class="player-title">—</div>
      <div id="playerArtist" class="player-artist">—</div>
    </div>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button class="ctrl" id="prevBtn" title="Previous" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl play-pause" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl" id="nextBtn" title="Next" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zm2-8.14 5.5 3.64L8 17.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <span id="curTime" class="time">0:00</span>
      <div class="prog-track" id="progTrack">
        <div class="prog-fill" id="progFill"></div>
        <div class="prog-thumb" id="progThumb"></div>
      </div>
      <span id="durTime" class="time">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <button class="ctrl-sm" id="dlBtn" title="Download">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
